# RecoverOS local development stack.
#   docker compose up -d mongo redis minio        # data services only (run API with npm)
#   docker compose --profile app up --build       # everything incl. API + worker
services:
  mongo:
    image: mongo:7.0
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      # Initialise the single-node replica set on first start (required for transactions).
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # S3-compatible private object storage for documents (development).
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: recoveros
      MINIO_ROOT_PASSWORD: recoveros-dev-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 recoveros recoveros-dev-secret; do sleep 2; done;
      mc mb --ignore-existing local/recoveros-private; mc anonymous set none local/recoveros-private"

  api:
    profiles: ["app"]
    build: { context: ., dockerfile: infrastructure/docker/api.Dockerfile }
    env_file: [.env]
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo:27017/recoveros?replicaSet=rs0&directConnection=true
      REDIS_URL: redis://redis:6379
      QUEUE_DRIVER: bullmq
      RUN_WORKERS_IN_API: "false"
      STORAGE_DRIVER: s3
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: recoveros
      STORAGE_SECRET_KEY: recoveros-dev-secret
    ports: ["4000:4000"]
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    profiles: ["app"]
    build: { context: ., dockerfile: infrastructure/docker/api.Dockerfile }
    command: ["node", "dist/worker.js"]
    env_file: [.env]
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo:27017/recoveros?replicaSet=rs0&directConnection=true
      REDIS_URL: redis://redis:6379
      QUEUE_DRIVER: bullmq
      STORAGE_DRIVER: s3
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: recoveros
      STORAGE_SECRET_KEY: recoveros-dev-secret
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  mongo-data:
  redis-data:
  minio-data:
